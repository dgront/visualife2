[workspace]
members = [
    ".",
    "bindings/python"
]

[package]
name = "visualife"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
rand = { version = "0.9.0-alpha.1", features = [] }
clap = { version = "4", features = ["derive"] }
thiserror = "1.0"
# displaydoc = "0.2"
datamatrix = { path = "../datamatrix" }
